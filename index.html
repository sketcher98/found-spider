<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Found</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  html, body { cursor: none; touch-action: none; overscroll-behavior: none; user-select: none; -webkit-touch-callout: none; margin: 0; height: 100%; }
  :root {
    --blue: #1129e2;
    --ink: #ffffff;
    --ink-70: rgba(255,255,255,0.7);
    --glass: rgba(255,255,255,0.1);
    --u: min(calc(100vw / 2000), calc(100dvh / 1125));
  }
  * { box-sizing: border-box; }
  body { background: var(--blue); color: var(--ink); font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  .page { width: 100vw; height: 100dvh; position: relative; }

  .frame { position: absolute; inset: 0; user-select: none; }
  .frame, .frame * { user-select: none; }

  /* nav */
  .top-nav {
    position: absolute;
    left: max(16px, 7vw); right: max(16px, 7vw);
    top: max(12px, calc(38 / 11.25 * 1dvh));
    height: max(40px, calc(56 * var(--u)));
    display: flex; align-items: center; justify-content: space-between;
  }
  .logo { display: flex; align-items: center; gap: 10px; position: relative; }
  .logo-folders { position: relative; width: max(40px, calc(157 * var(--u))); height: max(40px, calc(44 * var(--u))); }
  .logo-folders svg { position: absolute; left: 0; }
  .logo-folders .back { top: calc(6.33 * var(--u)); width: max(40px, calc(53 * var(--u))); height: calc(41 * var(--u)); }
  .logo-folders .front { top: calc(12.33 * var(--u)); width: max(40px, calc(53 * var(--u))); height: calc(34 * var(--u)); }
  .logo-word {
    font-size: max(28px, calc(36 * var(--u)));
    line-height: calc(44 * var(--u));
    letter-spacing: -0.08em; font-weight: 500;
  }
  .nav-links { display: flex; gap: 32px; font-size: max(15px, calc(22 * var(--u))); letter-spacing: -0.08em; white-space: nowrap; }
  .nav-links a { color: var(--ink); text-decoration: none; }
  .nav-links a.active { font-weight: 500; text-decoration: line-through; }
  .nav-right { display: flex; gap: 32px; width: max(120px, calc(157 * var(--u))); justify-content: flex-end; align-items: center; }

  .icon-btn { background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; display: inline-flex; }

  /* big wordmark */
  .found {
    position: absolute; left: 50%; top: calc(547 / 11.25 * 1dvh - 48 * var(--u));
    transform: translate(-50%, -50%);
    font-size: max(120px, calc(350 * var(--u)));
    line-height: calc(240 * var(--u));
    letter-spacing: -0.1em; text-indent: -0.1em;
    font-weight: 400; white-space: nowrap;
  }
  .found .o { color: transparent; }
  .over { position: absolute; inset: 0; pointer-events: none; }
  .over .found .o { color: var(--ink); }

  .mug, .ibook, .book, .tee { position: absolute; }
  .mug { left: calc(205 / 20 * 1vw); top: calc(359 / 11.25 * 1dvh - 48 * var(--u)); width: max(120px, calc(241 * var(--u))); }
  .ibook { right: calc(162 / 20 * 1vw); top: calc(323 / 11.25 * 1dvh); width: max(150px, calc(312 * var(--u))); }
  .book { right: calc(376 / 20 * 1vw); top: calc(689.5 / 11.25 * 1dvh); width: max(140px, calc(293 * var(--u))); }
  .tee { left: 50%; transform: translateX(-50%); bottom: 0; width: max(130px, calc(250 * var(--u))); transform-origin: 50% 100%; }

  .mug svg, .ibook svg, .book svg, .tee svg { width: 100%; height: auto; display: block; }

  /* radio player */
  .player {
    position: absolute;
    left: max(16px, 7vw); top: calc(509 / 11.25 * 1dvh - 48 * var(--u));
    width: max(240px, calc(291 * var(--u))); height: max(140px, calc(172 * var(--u)));
    padding: 16px; border-radius: 24px; display: flex; flex-direction: column; gap: 12px;
    background: var(--glass);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.25);
  }
  .player .head { display: flex; align-items: center; gap: 10px; }
  .player .art { width: 40px; height: 40px; border-radius: 12px; background: rgba(255,255,255,.2); flex: none; }
  .player .meta { flex: 1; min-width: 0; }
  .player .title { font-size: 18px; font-weight: 600; line-height: 1.1; }
  .player .sub { font-size: 12px; color: var(--ink-70); }
  .player .heart { width: 20px; height: 20px; opacity: .9; }
  .player .bar { height: 4px; border-radius: 2px; background: rgba(255,255,255,.2); overflow: hidden; position: relative; }
  .player .bar .fill { height: 100%; width: 46%; background: #fff; border-radius: 2px; }
  .player .bar.playing .fill {
    width: 100%;
    background: linear-gradient(90deg, rgba(255,255,255,.35), #fff 40%, rgba(255,255,255,.35) 80%);
    background-size: 200% 100%;
    animation: flow 2.4s linear infinite;
  }
  @keyframes flow { from { background-position: 0 0; } to { background-position: -200% 0; } }
  .player .times { display: flex; justify-content: space-between; font-size: 10px; font-weight: 600; color: var(--ink-70); font-variant-numeric: tabular-nums; }
  .player .times .live { display: inline-flex; align-items: center; gap: 4px; }
  .player .dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.5); }
  .player .dot.live { background: #ff5a5a; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  .player .controls { display: flex; align-items: center; gap: 14px; }
  .player .controls button { background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; color: #fff; display: inline-flex; }
  .player .controls .low { opacity: .55; }
  .player .controls .play { width: 48px; height: 48px; border-radius: 50%; background: #fff; display: inline-flex; align-items: center; justify-content: center; }
  .player .controls .play .bars { display: flex; gap: 5px; }
  .player .controls .play .bars i { width: 4.5px; height: 16px; background: var(--blue); border-radius: 2px; display: block; }
  .player .controls .play .tri { width: 0; height: 0; border-left: 18px solid var(--blue); border-top: 11px solid transparent; border-bottom: 11px solid transparent; margin-left: 4px; }

  /* headline/tagline */
  .cabinet {
    position: absolute; left: max(16px, 7vw); top: calc(775 / 11.25 * 1dvh);
    width: calc(396 * var(--u));
    font-size: max(34px, calc(80 * var(--u))); line-height: 1; letter-spacing: -0.1em;
  }
  .tagline {
    position: absolute; left: max(16px, 7vw); top: calc(959 / 11.25 * 1dvh);
    font-size: max(14px, calc(24 * var(--u))); line-height: calc(26 * var(--u));
    letter-spacing: -0.06em; color: var(--ink-70);
  }

  #spider-instructions {
    position: fixed; right: max(12px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom));
    font: 11px/1.5 Arial; letter-spacing: .02em; color: rgba(255,255,255,.65);
    z-index: 5; text-align: right; pointer-events: none;
  }

  .web-layer { position: absolute; inset: 0; pointer-events: none; z-index: 3; }

  /* responsive */
  @media (min-aspect-ratio: 1/1) and (max-height: 560px) {
    :root { --u: calc(100dvh / 900); }
    .tagline, .mug { display: none; }
    .book { right: calc(120 / 20 * 1vw); }
  }
  @media (min-aspect-ratio: 1/1) and (max-width: 1100px) {
    .nav-links { display: none; }
  }
  @media (max-aspect-ratio: 1/1) {
    :root { --u: min(100vw / 560, 1px); }
    .nav-links { display: none; }
    .top-nav { top: 16px; }
    .tee { width: calc(226 * var(--u)); bottom: 0; }
    .tagline {
      bottom: calc(226 * var(--u) + 16px); top: auto; left: 16px; right: 16px;
      font-size: max(13px, calc(26 * var(--u))); line-height: 1.2; width: auto;
    }
    .cabinet { bottom: calc(288 * var(--u) + 32px); top: auto; left: 16px; font-size: max(34px, calc(80 * var(--u))); }
    .player { bottom: calc(448 * var(--u) + 56px); top: auto; left: 16px; }
    .book { right: 3vw; bottom: calc(440 * var(--u) + 50px); top: auto; width: calc(210 * var(--u)); }
    .found {
      top: min(31dvh, calc(100dvh - 700 * var(--u) - 56px));
      font-size: max(80px, calc(195 * var(--u))); line-height: calc(150 * var(--u));
    }
    .mug { left: 2vw; top: calc(56px + 1dvh); width: calc(165 * var(--u)); }
    .ibook { right: 3vw; top: calc(50px + 1dvh); width: calc(165 * var(--u)); }
  }
  @media (max-aspect-ratio: 1/1) and (max-height: 700px) {
    .mug, .ibook { display: none; }
  }
  @media (hover: none) and (pointer: coarse) {
    #spider-instructions { font-size: 10.5px; line-height: 1.6; }
  }
</style>
</head>

<script>
(() => {
const W = () => window.innerWidth, H = () => window.innerHeight;
const page = document.getElementById('page');
const canvas = document.getElementById('web');
const ctx = canvas.getContext('2d');
const frame = document.getElementById('frame');
const over = document.getElementById('over');

let Wp, Hp, DPR;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  Wp = W(); Hp = H();
  canvas.width = Wp * DPR; canvas.height = Hp * DPR;
  canvas.style.width = Wp + 'px'; canvas.style.height = Hp + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  sampleAnchors();
}
window.addEventListener('resize', resize);
new ResizeObserver(resize).observe(page);

/* ---------------- camera / scale ---------------- */
let t = 1;
function computeScale() {
  const portrait = Wp < Hp;
  const short = Hp < 560;
  if (portrait) t = Math.max(0.78, Math.min(1.1, Wp / 480));
  else if (short) t = Math.max(0.68, Hp / 620);
  else t = Math.min(Wp / 1440, Hp / 810);
  t = Math.max(0.6, Math.min(1.25, t));
}
let K = () => 1.63 * t * 0.12;
let flySize = () => Math.max(0.75, 1.05 * t);

/* ---------------- radio player ---------------- */
const stations = [
  { name: 'Groove Salad', url: 'https://ice1.somafm.com/groovesalad-128-mp3' },
  { name: 'Lush', url: 'https://ice1.somafm.com/lush-128-mp3' },
  { name: 'Drone Zone', url: 'https://ice1.somafm.com/dronezone-128-mp3' },
];
let stationIdx = 0, audio = null, playing = false;
const elStatus = document.getElementById('playerstatus');
const elStation = document.getElementById('playerstation');
const elDot = document.getElementById('playerdot');
const elFill = document.getElementById('playerfill');
const elBar = document.getElementById('playerbar');
const elPlayIcon = document.getElementById('playicon');
function setStatus(s) {
  elStatus.textContent = s;
  elDot.classList.toggle('live', s === 'live');
}
function renderPlayIcon() {
  if (playing) {
    elPlayIcon.outerHTML = '<span class="bars" id="playicon"><i></i><i></i></span>';
  } else {
    elPlayIcon.outerHTML = '<span class="tri" id="playicon"></span>';
  }
}
function stopAudio() { if (audio) { try { audio.pause(); } catch(e){} audio = null; } playing = false; elFill.classList.remove('playing'); setStatus('offline'); elStation.textContent = '—'; renderPlayIcon(); }
function playStation(i) {
  stopAudio();
  stationIdx = (i + stations.length) % stations.length;
  audio = new Audio(stations[stationIdx].url);
  audio.preload = 'none';
  elStation.textContent = stations[stationIdx].name;
  setStatus('tuning…');
  audio.play().then(() => { playing = true; elFill.classList.add('playing'); setStatus('live'); renderPlayIcon(); })
    .catch(() => { elFill.classList.remove('playing'); setStatus('offline'); renderPlayIcon(); });
}
document.getElementById('play').addEventListener('click', e => { e.stopPropagation(); if (playing) stopAudio(); else playStation(stationIdx); });
document.getElementById('next').addEventListener('click', e => { e.stopPropagation(); playStation(stationIdx + 1); });
document.getElementById('prev').addEventListener('click', e => { e.stopPropagation(); playStation(stationIdx - 1); });
document.getElementById('shuffle').addEventListener('click', e => { e.stopPropagation(); playStation(Math.floor(Math.random() * stations.length)); });
document.getElementById('repeat').addEventListener('click', e => { e.stopPropagation(); playStation(stationIdx); });

/* ---------------- anchors ---------------- */
let anchors = [];
const maskCanvas = document.createElement('canvas');
const maskCtx = maskCanvas.getContext('2d');
function sampleAnchors() {
  maskCanvas.width = Wp; maskCanvas.height = Hp;
  maskCtx.clearRect(0, 0, Wp, Hp);
  anchors = [];
  const els = frame.querySelectorAll('[data-web-anchor]');
  els.forEach(el => {
    const r = el.getBoundingClientRect();
    if (r.width < 2 || r.height < 2) return;
    const off = document.createElement('canvas');
    off.width = Math.ceil(r.width * DPR); off.height = Math.ceil(r.height * DPR);
    const octx = off.getContext('2d');
    octx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const style = getComputedStyle(el);
    const disp = style.display;
    if (el.tagName === 'IMG' || el.querySelector('svg')) {
      try { octx.drawImage(el, 0, 0, r.width, r.height); } catch(e){}
      const id = octx.getImageData(0, 0, Math.ceil(r.width), Math.ceil(r.height));
      let alphaCount = 0, total = id.data.length / 4;
      for (let i = 3; i < id.data.length; i += 4) if (id.data[i] > 140) alphaCount++;
      if (alphaCount / total > 0.5) {
        maskCtx.fillStyle = '#fff';
        rr(maskCtx, r.left, r.top, r.width, r.height, 14);
        maskCtx.fill();
      } else {
        maskCtx.save();
        maskCtx.translate(r.left, r.top);
        maskCtx.drawImage(off, 0, 0, r.width, r.height);

function vibrateWeb(radius, strength, cx, cy) {
  for (const r of ropes) r.vibrate(strength, radius, cx, cy);
  if (liveThread) liveThread.vibrate(strength, radius, cx, cy);
}

/* ---------------- fly ---------------- */
const flyObj = {
  x: 0, y: 0, prev: [0, 0], ang: 0, landed: 0, t: 0, recoil: 0, dx: 0, dy: 0,
};
function initFly() {
  flyObj.x = pointer.x; flyObj.y = pointer.y;
  flyObj.prev = [pointer.x, pointer.y];
}
function updateFly(dt) {
  flyObj.t += dt;
  const ease = 1 - Math.exp(-(28 - 20 * flyObj.recoil) * dt);
  const nx = pointer.x + (flyObj.x - pointer.x) * (1 - ease);
  const ny = pointer.y + (flyObj.y - pointer.y) * (1 - ease);
  flyObj.prev = [flyObj.x, flyObj.y];
  flyObj.x = nx; flyObj.y = ny;
  const vx = flyObj.x - flyObj.prev[0], vy = flyObj.y - flyObj.prev[1];
  const sp = Math.hypot(vx, vy);
  if (sp > 60) flyObj.ang = Math.atan2(vy, vx);
  if (sp < 2) flyObj.landed = Math.min(1, flyObj.landed + 3 * dt);
  else flyObj.landed = Math.max(0, flyObj.landed - 10 * dt);
  flyObj.recoil = Math.max(0, flyObj.recoil - dt);
  const jx = (Math.sin(23.1 * flyObj.t) + 0.6 * Math.sin(37.7 * flyObj.t + 1.3)) * 2.2 * (1 - flyObj.landed);
  const jy = (Math.sin(29.3 * flyObj.t + 0.7) + 0.6 * Math.sin(41.9 * flyObj.t)) * 2.2 * (1 - flyObj.landed);
  flyObj.dx = jx; flyObj.dy = jy;
}

function drawFly() {
  const s = flySize();
  const x = flyObj.x + flyObj.dx, y = flyObj.y + flyObj.dy;
  const hover = 1 - flyObj.landed;
  ctx.save();
  ctx.translate(x, y);
  ctx.shadowColor = `rgba(0,0,0,${0.2 + 0.18 * flyObj.landed})`;
  ctx.shadowBlur = 3 + 9 * hover;
  ctx.shadowOffsetX = 3 + 14 * hover;
  ctx.shadowOffsetY = 5 + 26 * hover;
  ctx.rotate(flyObj.ang);
  const buzz = spider.caught ? 46 : (flyObj.landed < 0.5 ? 34 : 14);
  const q = spider.caught ? 1 : (0.5 + 0.5 * Math.sin(flyObj.t * buzz * 2 * Math.PI));
  const ghost = 4;
  for (let g = 0; g < ghost; g++) {
    ctx.save();
    ctx.rotate(Math.sin((flyObj.t * buzz + g / ghost) * 2 * Math.PI) * 0.9 * q);
    ctx.scale(1, 1 - 0.25 * q);
    ctx.fillStyle = 'rgba(220,230,240,.5)';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.ellipse(14 * s, -16 * s, 22 * s, 9 * s, -0.4, 0, 7);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.ellipse(14 * s, 16 * s, 22 * s, 9 * s, 0.4, 0, 7);
    ctx.fill();
    ctx.restore();
  }
  const bodyG = ctx.createRadialGradient(-4 * s, -3 * s, 1, 0, 0, 30 * s);
  bodyG.addColorStop(0, '#3a3a3a');
  bodyG.addColorStop(1, '#141414');
  ctx.fillStyle = bodyG;
  ctx.beginPath();
  ctx.ellipse(0, 0, 24 * s, 14 * s, 0, 0, 7);
  ctx.fill();
  ctx.fillStyle = '#4a2a1a';
  ctx.beginPath();
  ctx.arc(-8 * s, 0, 9 * s, 0, 7);
  ctx.fill();
  ctx.fillStyle = '#d43a2a';
  ctx.beginPath();
  ctx.arc(-11 * s, 0, 3.2 * s, 0, 7);
  ctx.fill();
  ctx.restore();
}

/* ---------------- objects ---------------- */
const objects = [];
function collectObjects() {
  objects.length = 0;
  frame.querySelectorAll('[data-web-anchor]').forEach(el => {
    const r = el.getBoundingClientRect();
    if (r.width > 0 && r.height > 0) {
      objects.push({ el, x: r.left, y: r.top, w: r.width, h: r.height, rot: 0, ox: 0, oy: 0, vx: 0, vy: 0, vr: 0 });
    }
  });
}
function nudgeObjects(strength) {
  for (const o of objects) {
    const r = o.el.getBoundingClientRect();
    const d = Math.hypot(r.left + o.w/2 - spider.x, r.top + o.h/2 - spider.y);
    if (d < 400) o.vr += (Math.random() - 0.5) * strength * 0.4;
  }
}
function updateObjects(dt) {
  const k = K();
  for (const o of objects) {
    const r = o.el.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const d = Math.hypot(cx - spider.x, cy - spider.y);
    const speed = Math.hypot(spider.vx, spider.vy);
    if (d < 260 * k && speed > 40 && !spider.jumping) {
      const ox = cx - spider.x, oy = cy - spider.y;
      const torque = Math.max(-2.5, Math.min(2.5, (ox * spider.vy - oy * spider.vx) / (o.w * o.h))) * 120 * dt;
      o.vr += torque;
      o.vx += spider.vx * 0.85 * dt;
      o.vy += spider.vy * 0.85 * dt;
    }
    const damp = Math.exp(-2.8 * dt);
    o.vx *= damp; o.vy *= damp; o.vr *= damp;
    o.ox += o.vx; o.oy += o.vy;
    o.rot += o.vr;
    const stick = o.el.dataset.stick === 'bottom';
    if (stick) {
      if (Math.abs(o.rot) > 8) o.vr += -Math.sign(o.rot) * (Math.abs(o.rot) - 8) * 20 * dt;
    } else {
      if (Math.abs(o.rot) > 24) o.vr += -Math.sign(o.rot) * (Math.abs(o.rot) - 24) * 8 * dt;
      if (Math.hypot(o.ox, o.oy) > 50) { o.vx -= o.ox * 8 * dt; o.vy -= o.oy * 8 * dt; }
    }
    o.ox *= Math.exp(-1.5 * dt); o.oy *= Math.exp(-1.5 * dt);
    if (stick) o.el.style.transform = `translate(-50%, 0) rotate(${o.rot}deg)`;
    else o.el.style.transform = `translate(${o.ox}px, ${o.oy}px) rotate(${o.rot}deg)`;
    if (Math.abs(o.vx) + Math.abs(o.vy) + Math.abs(o.vr) < 0.5 && Math.abs(o.ox) + Math.abs(o.oy) + Math.abs(o.rot) < 0.5) {
      o.el.style.transform = '';
    }
  }
}

/* ---------------- draw spider ---------------- */
const off = document.createElement('canvas');
const offctx = off.getContext('2d');
function drawSpider() {
  const k = K();
  const size = 1.63 * t;
  const scale = k * size;
  off.width = Math.max(2, Math.ceil(1254 * scale * 1.4));
  off.height = Math.max(2, Math.ceil(1254 * scale * 1.4));
  offctx.setTransform(1, 0, 0, 1, 0, 0);
  offctx.clearRect(0, 0, off.width, off.height);
  offctx.translate(off.width / 2, off.height / 2);
  offctx.rotate(spider.heading);
  offctx.scale(scale, scale);
  const abdomenBreathe = 1 + Math.sin(spider.phase) * (0.025 + 0.03 * spider.sleep);
  const squashY = 1 - 0.1 * spider.lt;
  const bodyScaleX = (2 - squashY) * abdomenBreathe;
  for (let i = 0; i < 8; i++) {
    const side = i < 4 ? 0 : 1;
    const leg = side === 0 ? SP.legs[i] : legRig(SP.legs[i - 4]);
    const hipB = toBody(leg[0][0], leg[0][1]);
    const footB = toBody(leg[2][0], leg[2][1]);
    const aLen = Math.hypot(leg[1][0] - leg[0][0], leg[1][1] - leg[0][1]);
    const bLen = Math.hypot(leg[2][0] - leg[1][0], leg[2][1] - leg[1][1]);
    const hip = [hipB[0] * 0.12, hipB[1] * 0.12];
    let foot = [footB[0] * 0.6, footB[1] * 0.6];
    const ft = spider.footT[i];
    const stepping = ft < 1;
    const lift = stepping ? Math.sin(Math.PI * (1 - ft)) * (i % 4 < 2 ? 12 : 26) : 0;
    const liftX = side === 0 ? -lift : lift;
    if (stepping) foot = [foot[0] + liftX, foot[1] + lift];
    const outward = side === 0 ? 1 : -1;
    const ik = legIK(hip, foot, aLen, bLen, outward);
    const width = 92;
    offctx.lineCap = 'round';
    offctx.strokeStyle = 'rgba(96,64,42,.92)';
    offctx.lineWidth = width;
    offctx.beginPath(); offctx.moveTo(hip[0], hip[1]); offctx.lineTo(ik.knee[0], ik.knee[1]); offctx.stroke();
    offctx.beginPath(); offctx.moveTo(ik.knee[0], ik.knee[1]); offctx.lineTo(foot[0], foot[1]); offctx.stroke();
    offctx.lineWidth = 6;
    offctx.strokeStyle = 'rgba(60,38,26,.8)';
    for (let h = 0; h < 3; h++) {
      const f = Math.random();
      const lx = hip[0] + (ik.knee[0] - hip[0]) * f, ly = hip[1] + (ik.knee[1] - hip[1]) * f;
      offctx.beginPath(); offctx.moveTo(lx, ly); offctx.lineTo(lx + (Math.random() - 0.5) * 40, ly + (Math.random() - 0.5) * 40); offctx.stroke();
    }
  }
  offctx.save();
  offctx.translate(0, -55);
  offctx.scale(bodyScaleX, squashY);
  const abG = offctx.createRadialGradient(-60, -80, 20, 0, 0, 220);
  abG.addColorStop(0, '#d8b390');
  abG.addColorStop(0.55, '#a5763f');
  abG.addColorStop(1, '#5e3a1e');
  offctx.fillStyle = abG;
  offctx.beginPath();
  offctx.ellipse(0, 0, 220, 205, 0, 0, 7);
  offctx.fill();
  offctx.restore();
  const headAlpha = 1 - spider.qt * 0.85;
  if (headAlpha > 0.02) {
    offctx.save();
    offctx.globalAlpha = headAlpha;
    const hG = offctx.createRadialGradient(-50, -40, 15, 0, 0, 170);
    hG.addColorStop(0, '#d8b390');
    hG.addColorStop(0.6, '#a5763f');
    hG.addColorStop(1, '#5e3a1e');
    offctx.fillStyle = hG;
    offctx.beginPath();
    offctx.ellipse(0, 90, 172, 148, 0, 0, 7);
    offctx.fill();
    offctx.beginPath();
    offctx.ellipse(-85, 280, 74, 70, 0, 0, 7);
    offctx.fill();
    offctx.beginPath();
    offctx.ellipse(82, 280, 74, 70, 0, 0, 7);
    offctx.fill();
    offctx.restore();
  }
  if (spider.qt > 0.01) {
    offctx.save();
    offctx.globalAlpha = spider.qt;
    offctx.translate(0, 90);
    offctx.scale(3.3 * (0.9 + 0.1 * Math.sin(spider.phase * 0.5)), 3.3 * (0.9 + 0.1 * Math.sin(spider.phase * 0.5)));
    offctx.translate(-154, -150);
    const fG = offctx.createRadialGradient(-80, -100, 20, 0, 0, 160);
    fG.addColorStop(0, '#e8cfa8');
    fG.addColorStop(0.6, '#b5834e');
    fG.addColorStop(1, '#6e4526');
    offctx.fillStyle = fG;
    offctx.beginPath();
    offctx.ellipse(0, 0, 160, 150, 0, 0, 7);
    offctx.fill();
    const eyes = [[139,158,12.5],[170,158,12.5],[117,150,7.5],[192,150,7.5],[112,136,4],[197,136,4]];
    const blink = spider.sleep > 0.4 ? 1 : (spider.blinkT > 0 ? 1 : 0);
    for (const [ex, ey, er] of eyes) {
      offctx.fillStyle = '#1a0e06';
      offctx.beginPath();
      offctx.arc(ex, ey, er, 0, 7);
      offctx.fill();
      offctx.fillStyle = 'rgba(255,255,255,.85)';
      offctx.beginPath();
      offctx.arc(ex - er * 0.3, ey - er * 0.3, er * 0.3, 0, 7);
      offctx.fill();
      if (blink > 0.5) {
        offctx.fillStyle = '#6e4526';
        offctx.beginPath();
        offctx.arc(ex, ey, er + 1, 0, Math.PI);
        offctx.fill();
        offctx.strokeStyle = 'rgba(40,22,12,.7)';
        offctx.lineWidth = 2;
        offctx.beginPath();
        offctx.arc(ex, ey, er + 1, 0, Math.PI);
        offctx.stroke();
      }
    }
    offctx.strokeStyle = 'rgba(60,32,16,.7)';
    offctx.lineWidth = 4;
    offctx.beginPath();
    offctx.arc(154, 185, 14, 0.2, Math.PI - 0.2);
    offctx.stroke();
    offctx.restore();
  }
  if (spider.sleep > 0.4) {
    offctx.save();
    offctx.globalAlpha = spider.sleep;
    for (let z = 0; z < 3; z++) {
      const c = (time * 0.4 + z / 3) % 1;
      const rise = c * 70;
      const zx = 260 + c * 40, zy = -170 - rise;
      offctx.font = `700 ${(12 + 14 * c) * 3.3}px system-ui`;
      offctx.fillStyle = 'rgba(0,0,0,.25)';
      offctx.fillText('z', zx + 2, zy + 2);
      offctx.fillStyle = `rgba(255,255,255,${Math.sin(Math.PI * c)})`;
      offctx.fillText('z', zx, zy);
    }
    offctx.restore();
  }
  const h = spider.jumpH;
  const shadowScale = 1 + h / 260;
  ctx.save();
  ctx.translate(spider.x, spider.y);
  ctx.shadowColor = `rgba(0,0,0, ${0.42 - Math.min(0.24, h / 500)})`;
  ctx.shadowBlur = 7 + 0.14 * h;
  ctx.shadowOffsetX = 5 + 0.35 * h;
  ctx.shadowOffsetY = 9 + 0.6 * h;
  ctx.scale(shadowScale, shadowScale);
  ctx.drawImage(off, -off.width / 2, -off.height / 2, off.width, off.height);
  ctx.restore();
}

/* ---------------- silk creation ---------------- */
let attachTimer = 0;
function updateSilk(dt) {
  const k = K();
  const sp = SP.spinneret;
  const [sx, sy] = fromBody(sp[0] - 627, sp[1] - 600);
  const sX = spider.x + sx * k * 0.12, sY = spider.y + sy * k * 0.12;
  if (!liveThread) {
    liveStart = { x: sX, y: sY };
    liveThread = new Rope(sX, sY, spider.x, spider.y);
  } else {
    liveThread.x2 = spider.x; liveThread.y2 = spider.y;
    liveThread.points[12] = [spider.x, spider.y];
    liveThread.step(dt, windAt(time, 0));
  }
  attachTimer -= dt;
  if (attachTimer <= 0) {
    attachTimer = 0.4;
    if (anchors.length) {
      let best = null, bestD = 70;
      for (const an of anchors) {
        const d = Math.hypot(an.x - sX, an.y - sY);
        if (d < bestD) { bestD = d; best = an; }
      }
      if (best) {
        const startD = Math.hypot(best.x - liveThread.x1, best.y - liveThread.y1);
        const threadD = Math.hypot(best.x - liveThread.x2, best.y - liveThread.y2);
        if (startD > 30 && threadD > 54) {
          const rope = new Rope(liveThread.x1, liveThread.y1, best.x, best.y);
          rope.thick = 1.25;
          ropes.push(rope);
          vibrateWeb(60, 1.2, best.x, best.y);
          let nearest = null, nd = 288;
          for (const an of anchors) {
            const d = Math.hypot(an.x - best.x, an.y - best.y);
            if (d < nd && d > 5 && an !== best) { nd = d; nearest = an; }
          }
          if (nearest) {
            const r2 = new Rope(best.x, best.y, nearest.x, nearest.y);
            r2.thick = 0.7;
            ropes.push(r2);
          }
          if (Math.random() < 0.75) {
            let n2 = null, nd2 = 204;
            for (const an of anchors) {
              const d = Math.hypot(an.x - best.x, an.y - best.y);
              if (d < nd2 && d > 45 && an !== best) { nd2 = d; n2 = an; }
            }
            if (n2) {
              const r3 = new Rope(best.x, best.y, n2.x, n2.y);
              r3.thick = 0.85;
              ropes.push(r3);
            }
          }
          liveThread.x1 = best.x; liveThread.y1 = best.y;
          liveThread.points[0] = [best.x, best.y];
        }
      }
    } else {
      if (Math.random() < 0.15) {
        const px = Math.random() * Wp, py = Math.random() * Hp;
        const rope = new Rope(liveThread.x1, liveThread.y1, px, py);
        rope.thick = 0.9;
        ropes.push(rope);
        liveThread.x1 = px; liveThread.y1 = py;
        liveThread.points[0] = [px, py];
      }
    }
  }
  for (const r of ropes) r.fade = Math.max(0, r.fade - dt / 90);
  ropes = ropes.filter(r => r.fade > 0.01);
  shadowCanvas.width = Wp; shadowCanvas.height = Hp;
  shadowCtx.clearRect(0, 0, Wp, Hp);
  shadowCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
  shadowCtx.shadowColor = 'rgba(8,14,70,.42)';
  shadowCtx.shadowBlur = 3.5;
  shadowCtx.shadowOffsetX = 7;
  shadowCtx.shadowOffsetY = 11;
  for (const r of ropes) {
    for (let i = 0; i < r.n; i++) {
      const a = r.points[i], b = r.points[i+1];
      shadowCtx.strokeStyle = 'rgba(0,0,0,1)';
      shadowCtx.lineWidth = r.thick;
      shadowCtx.beginPath(); shadowCtx.moveTo(a[0], a[1]); shadowCtx.lineTo(b[0], b[1]); shadowCtx.stroke();
    }
  }
  shadowCtx.globalCompositeOperation = 'destination-in';
  shadowCtx.drawImage(maskCanvas, 0, 0, Wp, Hp);
  shadowCtx.globalCompositeOperation = 'source-over';
}
const shadowCanvas = document.createElement('canvas');
const shadowCtx = shadowCanvas.getContext('2d');

function windAt(t, y) {
  return (Math.sin(0.45 * t) * 0.6 + Math.sin(1.3 * t + 1.7) * 0.4) * (0.6 + 0.4 * Math.sin(1.1 * t + 0.012 * y)) * 22;
}

/* ---------------- clear web ---------------- */
function clearWeb() {
  for (const r of ropes) {
    for (const d of r.dew) if (!d.splat) { d.fall = true; const i0 = Math.floor(d.f * r.n); d.x = r.points[i0][0]; d.y = r.points[i0][1]; d.vy = 0; }
  }
  ropes = [];
  if (liveThread) { liveThread = null; liveStart = { x: spider.x, y: spider.y }; }
  vibrateWeb(200, 4, spider.x, spider.y);
}

/* ---------------- input ---------------- */
window.addEventListener('pointermove', e => {
  pointer.x = e.clientX; pointer.y = e.clientY;
  pointer.active = true;
  const now = performance.now() / 1000;
  if (now - pointer.lastMove > 0.25) pointer.movedSinceSleep = true;
  pointer.lastMove = now;
  if (!fly) initFly();
});
let touchInterval = null;
window.addEventListener('pointerdown', e => {
  pointer.down = true;
  pointer.holdT = 0;
  if (e.pointerType === 'touch') {
    touchInterval = setInterval(() => {
      pointer.holdT += 0.05;
      if (pointer.holdT >= 0.65) { clearWeb(); navigator.vibrate && navigator.vibrate(30); }
    }, 50);
  }
  if (e.target.closest('button, a, input, [data-no-spider]')) return;
  if (!fly) initFly();
});
window.addEventListener('pointerup', e => {
  pointer.down = false;
  clearInterval(touchInterval);
  if (e.target.closest('button, a, input, [data-no-spider]')) return;
  if (pointer.holdT < 0.65) jumpToFly();
});
window.addEventListener('pointercancel', () => { clearInterval(touchInterval); });
window.addEventListener('pointerleave', () => { fly = null; pointer.active = false; });

function jumpToFly() {
  if (!fly) return;
  const k = K();
  const mouthX = spider.x + Math.cos(spider.heading) * 360 * k;
  const mouthY = spider.y + Math.sin(spider.heading) * 360 * k;
  const dx = fly.x - mouthX, dy = fly.y - mouthY;
  const d = Math.hypot(dx, dy);
  const maxD = 360 * k;
  let tx = fly.x, ty = fly.y;
  if (d > maxD) { tx = mouthX + dx / d * maxD; ty = mouthY + dy / d * maxD; }
  spider.jumping = true;
  spider.jumpFrom = [spider.x, spider.y];
  spider.jumpTo = [tx, ty];
  spider.jumpPeak = Math.max(22, Math.min(130, 0.3 * Math.hypot(tx - spider.x, ty - spider.y)));
  spider.jumpDur = Math.max(0.28, Math.min(0.6, Math.hypot(tx - spider.x, ty - spider.y) / 1100));
  spider.jumpT = 0;
  const flyD = Math.hypot(fly.x - tx, fly.y - ty);
  if (flyD < 55 * flySize()) {
    spider.caught = fly;
    spider.catchT = 3 + Math.random() * 1.2;
  }
  flyObj.recoil = 0.6;
}

document.addEventListener('keydown', e => {
  if (e.key === 'Delete' || e.key === 'Backspace') {
    if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') { e.preventDefault(); clearWeb(); }
  }
});
window.addEventListener('dblclick', e => {
  if (e.target.closest('button, a, input')) return;
  jumpToFly();
});

/* ---------------- main loop ---------------- */
let time = 0;
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  time += dt;
  computeScale();
  if (!fly && pointer.active && pointer.x > -50) initFly();
  if (fly) updateFly(dt);
  updateObjects(dt);
  updateSpider(dt);
  updateSilk(dt);

  ctx.clearRect(0, 0, Wp, Hp);
  ctx.drawImage(shadowCanvas, 0, 0, Wp, Hp);
  if (liveThread) liveThread.draw();
  for (const r of ropes) r.draw();
  for (const r of ropes) {
    for (const d of r.dew) {
      if (d.splat) {
        ctx.fillStyle = 'rgba(255,255,255,.5)';
        ctx.beginPath(); ctx.arc(d.x, d.y, d.r * 0.8, 0, 7); ctx.fill();
        ctx.fillStyle = 'rgba(0,0,0,.12)';
        ctx.beginPath(); ctx.ellipse(d.x, d.y + d.r * 0.6, d.r * 0.9, d.r * 0.35, 0, 0, 7); ctx.fill();
      }
    }
  }
  drawSpider();
  if (fly) drawFly();
  window.__dbg = { anchors: anchors.length, ropes: ropes.length, live: !!liveThread, spider: [Math.round(spider.x), Math.round(spider.y)], fly: !!fly };
  requestAnimationFrame(loop);
}

resize();
initSpider();
collectObjects();
requestAnimationFrame(loop);
})();
</script>
